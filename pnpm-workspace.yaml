packages:
  - '.'

allowBuilds:
  '@nestjs/core': true
  # Trae binarios precompilados
  '@parcel/watcher': false
  '@prisma/engines': true
  # Telemetría
  '@scarf/scarf': false
  '@swc/core': true
  prisma: true
  unrs-resolver: true

overrides:
  # Dependencia no usada del CLI de Prisma
  mysql2: '^3.22.0'

auditConfig:
  ignoreGhsas:
    # deepmerge-ts vía el CLI de Prisma: nunca recibe entrada de usuarios y 8.x rompe Prisma
    - GHSA-ggr8-5vv4-36mx
