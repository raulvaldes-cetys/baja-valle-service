name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  checks:
    name: Lint, typecheck, tests y build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: baja_valle_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm lint:check
      - run: pnpm typecheck
      - run: pnpm test
      - name: Prepare test database
        env:
          PGHOST: localhost
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: baja_valle_test
          MIGRATOR_DB_PASSWORD: migrator_local
          APP_DB_PASSWORD: app_local
        run: sh docker/postgres/init-roles.sh && pnpm db:test:prepare
      - run: pnpm test:e2e
      - run: pnpm exec nest build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm audit --audit-level high

  infra:
    name: Terraform checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra
      - name: Validate
        run: |
          for dir in infra infra/bootstrap; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --chdir=infra --init
          tflint --chdir=infra --config="$PWD/infra/.tflint.hcl" --recursive
      - name: Trivy (fails on high and critical findings)
        run: |
          docker run --rm -v "$PWD/infra:/infra:ro" \
            aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222 \
            config --severity HIGH,CRITICAL --exit-code 1 --ignorefile /infra/.trivyignore.yaml /infra

  deploy:
    name: Deploy to Azure
    needs: [secrets, checks, audit, infra]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      APP: ${{ vars.API_APP_NAME }}
      JOB: ${{ vars.MIGRATE_JOB_NAME }}
      IMAGE: ${{ vars.ACR_NAME }}.azurecr.io/baja-valle-api:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
      - name: Build and push the image
        run: |
          az acr login -n "${{ vars.ACR_NAME }}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
      - name: Run database migrations
        run: |
          az containerapp job update -g "$RG" -n "$JOB" --image "$IMAGE" -o none
          execution=$(az containerapp job start -g "$RG" -n "$JOB" --query name -o tsv)
          for _ in $(seq 1 60); do
            status=$(az containerapp job execution show -g "$RG" -n "$JOB" --job-execution-name "$execution" --query properties.status -o tsv)
            case "$status" in
              Succeeded) exit 0 ;;
              Failed|Stopped|Degraded)
                az containerapp job logs show -g "$RG" -n "$JOB" --execution "$execution" --container migrate --format text || true
                exit 1 ;;
            esac
            sleep 10
          done
          echo "Migrations did not finish in time"
          exit 1
      - name: Deploy the API
        run: |
          az containerapp update -g "$RG" -n "$APP" --image "$IMAGE" -o none
          url="https://$(az containerapp show -g "$RG" -n "$APP" --query properties.configuration.ingress.fqdn -o tsv)"
          for _ in $(seq 1 18); do
            if curl -fsS --max-time 20 "$url/" >/dev/null; then exit 0; fi
            sleep 10
          done
          echo "The API did not answer after the deployment"
          exit 1

