# Credenciales solo para desarrollo local
services:
  db:
    image: postgres:17-alpine
    container_name: baja-valle-db
    environment:
      POSTGRES_DB: baja_valle
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_local}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:-migrator_local}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-app_local}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-roles.sh:/docker-entrypoint-initdb.d/01-init-roles.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d baja_valle']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
